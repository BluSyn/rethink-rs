[package]
name = "rethink-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rethink-cloud: emulates LG ThinQ cloud and bridges to Home Assistant MQTT"

[[bin]]
name = "rethink-cloud"
path = "src/main.rs"

[dependencies]
rethink-util = { workspace = true }
rethink-core = { workspace = true }
rethink-devices = { workspace = true }
rethink-bridge = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
rcgen = { workspace = true }
# Device-facing HTTPS/MQTTS need legacy CBC-SHA / TLS1.0 for RTK_RTL8711am (PR#131).
# rustls deliberately omits those suites; OpenSSL matches the Node device_tls profile.
openssl = "0.10"
tokio-openssl = "0.6"
rumqttc = { workspace = true }
# Asks the Home Assistant Supervisor for its MQTT service in add-on mode.
reqwest = { workspace = true }
clap = { workspace = true }
include_dir = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
url = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
