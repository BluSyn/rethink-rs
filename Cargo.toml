[workspace]
resolver = "2"
members = [
    "crates/rethink-util",
    "crates/rethink-core",
    "crates/rethink-devices",
    "crates/rethink-bridge",
    "crates/rethink-cloud",
    "crates/rethink-setup",
    "crates/rethink-tools",
]
default-members = [
    "crates/rethink-util",
    "crates/rethink-core",
    "crates/rethink-devices",
    "crates/rethink-bridge",
    "crates/rethink-cloud",
    "crates/rethink-setup",
    "crates/rethink-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
rethink-util = { path = "crates/rethink-util" }
rethink-core = { path = "crates/rethink-core" }
rethink-devices = { path = "crates/rethink-devices" }
rethink-bridge = { path = "crates/rethink-bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
base64 = "0.23"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.11"
hmac = "0.13"
url = "2"
include_dir = "0.7"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
tower = "0.5"
http-body-util = "0.1"
rand = "0.10"
